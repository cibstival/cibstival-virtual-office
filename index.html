<script>
/* ---------- 데이터 ---------- */
const ROSTER = {

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W=960, H=440, FLOOR=388, P=4;
const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr,dpr); ctx.imageSmoothingEnabled=false;

const DESK = {whip:80, mac:235, pc:385, oke:530, api:720, scrooge:870};
const COFFEE = 628, BOARD = 470, METER = 34;

function r(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function rr(x,y,w,h,rad,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,rad):ctx.rect(x,y,w,h);ctx.fill();}

/* 캐릭터 도트 (12x20 칸, 칸당 3px) */
function drawChar(c, t){
  const look = ROSTER[c.id];

  const px=(x,y,w,h,col)=>r(ox+x*P, oy+y*P, w*P, h*P, col);
  const OUT="#1a1622", SKIN="#ffd9b8", EYE="#2a2236";
  const grey = c.status==="stopped";
  if(grey) ctx.filter="grayscale(1) brightness(.85)";
  // 그림자
  if(c.pose!=="sit"){ ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(c.x, c.y+1, 20, 5, 0, 0, 7); ctx.fill(); }

  px(1,0,10,9,OUT);

function dayF(h){ const s=x=>Math.max(0,Math.min(1,x)); return Math.min(s((h-(SUNRISE-0.6))/1.2), s(((SUNSET+0.6)-h)/1.2)); }

/* ---------- 캐릭터 상태 ---------- */
const chars = ORDER.map((id,i)=>({id, x:DESK[id]-20, y:FLOOR-12, home:DESK[id]-20, pose:"sit", walking:false, target:null, plan:[], wait:0, bubble:"", bubbleT:0, nextTalk:2+i*2, nextTrip:4+i*4, status:"idle", seed:Math.random(), sess:null}));
function sess(id){ return DATA && DATA.sessions ? DATA.sessions.find(s=>s.id===id) : null; }
function say(c, txt, dur){ c.bubble=txt; c.bubbleT=dur||4; }
function go(c, x, then){ c.plan.push({x, then}); }

function update(c, dt, t){
  const s = sess(c.id); c.sess = s; const st = s ? s.status : "idle";
  if(st!==c.status){ c.status = st; c.plan=[]; c.target=null; }
  if(c.bubbleT>0) c.bubbleT-=dt;
  // 이동 중이면 계속 걷기
  if(c.target!=null){
    c.walking=true; c.pose="stand"; c.y=FLOOR;
    const d = c.target - c.x, step = 70*dt*Math.sign(d);
    if(Math.abs(d) <= Math.abs(step)){ c.x=c.target; c.target=null; c.walking=false; const nx=c.plan.shift(); if(nx && nx.then) nx.then(); }
    else c.x += step;
    return;
  }
  if(c.wait>0){ c.wait-=dt; return; }
  if(c.plan.length){ c.target = c.plan[0].x; return; }

  const atHome = Math.abs(c.x-c.home)<2;
  if(st==="stopped"){ if(!atHome){ c.target=c.home; c.plan=[{x:c.home}]; return; } c.pose="sit"; c.y=FLOOR-12; return; }
  if(st==="idle"){ if(!atHome){ c.target=c.home; c.plan=[{x:c.home}]; return; } c.pose="sleep"; c.y=FLOOR-12; return; }
  if(st==="waiting"){
    // 라운지 배회
    c.pose="stand"; c.y=FLOOR;
    const nx = 120 + Math.random()*700;
    c.plan=[{x:nx, then:()=>{ c.wait=2+Math.random()*4; if(Math.random()<.6) say(c, "대기: "+((s&&s.task)||"…"), 4); }}];
    c.target = nx; return;
  }
  // working
  if(!atHome && c.plan.length===0){ c.target=c.home; c.plan=[{x:c.home}]; return; }
  c.pose="sit"; c.y=FLOOR-12;
  c.nextTalk -= dt; c.nextTrip -= dt;
  if(c.nextTalk<=0){ c.nextTalk = 10+Math.random()*10; if(s && s.task) say(c, s.task, 4.5); }
  if(c.nextTrip<=0){
    c.nextTrip = 14+Math.random()*16;
    if(c.id==="whip"){ c.plan=[{x:DESK.oke-70, then:()=>{ c.wait=3; const u=(DATA&&DATA.usage)||{}; say(c, `사용량 ${u.pct??"-"}% · ${u.state??""} ⏱`, 3);} },{x:c.home}]; c.target=c.plan[0].x; return; }
    if(c.id==="oke"){ c.plan=[{x:BOARD, then:()=>{ c.wait=3; say(c,"계획 갱신 중…",3);} },{x:c.home}]; c.target=c.plan[0].x; return; }
    if(c.id==="scrooge"){ c.plan=[{x:COFFEE+30, then:()=>{ c.wait=3; say(c,"토큰 아끼자!",3);} },{x:c.home}]; c.target=c.plan[0].x; return; }
    if(s && (s.reported || Math.random()<.5)){ const ox = DESK.oke + (c.x<DESK.oke? -70: 70);
      c.plan=[{x:ox, then:()=>{ c.wait=3; say(c,"보고드립니다! 📄",3); const o=chars.find(q=>q.id==="oke"); if(o) say(o,"확인했어요 👍",2.5);} },{x:c.home}]; c.target=c.plan[0].x; return; }
  }
}

/* ---------- 루프 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now; const t = now/1000;
  chars.forEach(c=>update(c,dt,t));
  drawRoom(t);
  const sitters = chars.filter(c=>c.pose==="sit"||c.pose==="sleep");
  const walkers = chars.filter(c=>!(c.pose==="sit"||c.pose==="sleep"));
  sitters.forEach(c=>drawChar(c,t));
  ORDER.forEach(id=>drawDesk(id, chars.find(c=>c.id===id), t));
  walkers.sort((a,b)=>a.x-b.x).forEach(c=>drawChar(c,t));
  // 앉은 캐릭터 이름표·말풍선은 책상 위에 다시
  sitters.forEach(c=>drawNameOnly(c));
  requestAnimationFrame(frame);
}
function drawNameOnly(c){
  const look=ROSTER[c.id]; ctx.font="700 11px 'Noto Sans KR'";
  const tw=ctx.measureText(look.name).width+18, ny=DESKTOP+48;
  rr(c.x-tw/2+18, ny, tw, 16, 4, "rgba(20,18,32,.85)");
  ctx.fillStyle=(STAT[c.status]||["","#b7b2cf"])[1]; ctx.beginPath(); ctx.arc(c.x-tw/2+26, ny+8, 3,0,7); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillText(look.name, c.x-tw/2+32, ny+12);
  if(c.bubble && c.bubbleT>0){
    const txt=c.bubble.length>24?c.bubble.slice(0,23)+"…":c.bubble;
    const bw=ctx.measureText(txt).width+14, bx=Math.max(4,Math.min(W-bw-4,c.x-bw/2)), by=c.y-20*P-30;
    rr(bx,by,bw,20,6,"#fffdf3"); ctx.fillStyle="#fffdf3"; ctx.beginPath(); ctx.moveTo(c.x-4,by+20); ctx.lineTo(c.x+4,by+20); ctx.lineTo(c.x,by+26); ctx.fill();
    ctx.fillStyle="#22202a"; ctx.fillText(txt,bx+7,by+14);
  }
}
requestAnimationFrame(frame);

/* 클릭 → 정보 */
cv.addEventListener("click", e=>{
  const b = cv.getBoundingClientRect(), x=(e.clientX-b.left)*W/b.width, y=(e.clientY-b.top)*H/b.height;
  const c = chars.slice().reverse().find(c=>c.hit && x>=c.hit.x && x<=c.hit.x+c.hit.w && y>=c.hit.y && y<=c.hit.y+c.hit.h+40);
  if(!c) return;
  const s = c.sess||{}, look=ROSTER[c.id], st=STAT[c.status]||["-","#b7b2cf"];
  const esc = v => String(v??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  document.getElementById("info").innerHTML = `<b>${esc(look.name)}</b><span class="pill" style="background:${st[1]}">${st[0]}</span>
    <div class="row"><span class="lbl">역할</span>${esc(look.role)}</div>
    <div class="row"><span class="lbl">지금 할 일</span>${esc(s.task||"-")}</div>
    <div class="row"><span class="lbl">마지막 보고 ${esc(s.last||"-")}</span>${esc(s.note||"")}</div>`;
  say(c, "저요?", 1.5);
});

/* HUD */
function renderHUD(d){
  const esc = v => String(v??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  const u=d.usage||{}, pct=u.pct||0;
  document.getElementById("hp").innerHTML = `<div class="f" style="width:${Math.min(100,pct)}%;background:linear-gradient(#ff8a7a,#e0453b)"></div>
    <div class="m" style="left:${u.stop||92}%"></div>${u.allowed!=null?`<div class="m a" style="left:${u.allowed}%"></div>`:""}
    <div class="t">${esc(u.pct)}% / 멈춤 ${esc(u.stop||92)}%</div>`;
  document.getElementById("hpState").textContent = `상태: ${u.state||"-"} · 허용 ${u.allowed??"-"}%(파란 선)`;
  document.getElementById("hpAt").textContent = u.at? "읽은 시각 "+u.at : "";
  const items=(d.progress&&d.progress.items)||[];
  const eng=items[0]; const ev=eng?parseFloat(String(eng.v)):0;
  document.getElementById("exp").innerHTML = `<div class="f" style="width:${Math.min(100,ev||0)}%;background:linear-gradient(#fff08a,#e8b92f)"></div><div class="t" style="color:#1d1b2b;text-shadow:none">${esc(eng?eng.v:"-")}</div>`;
  document.getElementById("expL").textContent = eng? eng.l : "";
  document.getElementById("kpi").innerHTML = items.slice(1).map(k=>`<div><b style="color:var(--gold)">${esc(k.v)}</b> <span style="color:#b9b3e0">${esc(k.l)}</span></div>`).join("");
  document.getElementById("feed").innerHTML = (d.feed||[]).map(f=>`<li><span class="t">${esc(f.t)}</span><b>${esc(f.who)}</b><span>${esc(f.text)}</span></li>`).join("");
  document.getElementById("upd").textContent = "판 갱신: "+(d.updated||"-")+" · 오케가 정기 점검 때마다 갱신 · 캐릭터는 이 사무실을 위해 새로 그린 도트 캐릭터";
}

(async ()=>{
  if(typeof window.claude==="undefined" || !window.claude || !window.claude.use){ useDemo("데모 모드 — claude.ai 아티팩트 밖에서는 예시 데이터로 움직입니다"); return; }
  const timer=setTimeout(()=>{document.getElementById("upd").textContent="판 데이터를 아직 불러오지 못했습니다(로그인 필요).";},10000);
  try{
    const db = await claude.use("db");
    if(!db){ clearTimeout(timer); document.getElementById("upd").textContent="이 화면에서는 판 데이터를 볼 수 없습니다(로그인 필요)."; return; }
    db.doc("office/state").onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(timer);
      const d = snap.exists ? snap.data() : null;
      if(d && d.sessions){ DATA=d; renderHUD(d); } else document.getElementById("upd").textContent="아직 판 데이터 없음 — 오케가 다음 점검 때 채웁니다";
    }, ()=>{ clearTimeout(timer); document.getElementById("upd").textContent="판 데이터를 불러오지 못했습니다."; });
  }catch(e){ clearTimeout(timer); document.getElementById("upd").textContent="판 데이터를 불러오지 못했습니다."; }
})();
